name: Build, label, push and deploy hardening labs demo

on:
  push:
    branches: [main]
    paths:
      - "06-K8s/hardening-labs-demo/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      # OCI labels let Defender for Cloud map these pods back to this repo/commit.
      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_NAME }}.azurecr.io/hardening-labs-demo
          tags: |
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: 06-K8s/hardening-labs-demo/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy hardening lab pods
        run: |
          IMAGE_TAG="${{ vars.ACR_NAME }}.azurecr.io/hardening-labs-demo:sha-${{ github.sha }}"
          for f in capsysadmin.yaml privileged-container.yaml container-as-root.yaml; do
            sed "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|" 06-K8s/hardening-labs-demo/$f | kubectl apply -f -
          done
          kubectl -n hardening-demo get pods -o wide
